<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Joyce's Web">
  <meta name="theme-color" content="#2b86f0">
  <title>Joyce's Web</title>
  <link rel="icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/site.css">
</head>
<body class="home">
  <div class="sky" aria-hidden="true">
    <div class="sun"></div>
    <div class="cloud cloud-a"></div>
    <div class="cloud cloud-b"></div>
    <div class="cloud cloud-c"></div>
  </div>
  <main class="wrap">
    <header class="hero">
      <p class="hello">Hello, Joyce!</p>
      <h1>Joyce's Web</h1>
      <p class="tag">Tap a game to play.</p>
    </header>
    <section id="game-list" class="game-list" aria-label="Games"></section>
    <ul class="parade" aria-hidden="true">
      <li>🐶</li>
      <li>🐱</li>
      <li>🦊</li>
      <li>🦉</li>
      <li>🐻</li>
      <li>🐸</li>
      <li>🦁</li>
      <li>🐼</li>
    </ul>
  </main>
  <footer class="foot">Made for Joyce</footer>
  <script src="games.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
